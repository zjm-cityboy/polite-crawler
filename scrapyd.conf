# Scrapyd 守护进程配置（容器内 /app/scrapyd.conf，scrapyd 自动读取）

# 踩坑记录：老教程里都有 [services] 段（scrapyd.webutils.JsonRpcResource），
# scrapyd 1.6 已移除 webutils 模块，照抄会导致启动即崩（ModuleNotFoundError）；
# 内置 HTTP API 服务在新版是默认注册的，不需要也不能再手动声明。

[scrapyd]
# 监听所有网卡：容器内服务必须 0.0.0.0，否则宿主机访问不到
bind_address = 0.0.0.0
http_port = 6800
# egg 与日志的存放目录（容器内路径；生产可挂卷持久化）
eggs_dir    = eggs
logs_dir    = logs
dbs_dir     = dbs
